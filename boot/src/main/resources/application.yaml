server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always

springdoc:
  show-actuator: true

app:
  security:
    ignore-paths: "/actuator/**,/v3/api-docs/**,/swagger-ui/**,/api/auth/login,/api/auth/signup"

    cors:
      allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:*}
      allowed-methods: ${SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${SECURITY_CORS_ALLOWED_HEADERS:Content-Type,Authorization,Accept,Origin,X-Requested-With}
      exposed-headers: ${SECURITY_CORS_EXPOSED_HEADERS:Authorization}
      allow-credentials: ${SECURITY_CORS_ALLOW_CREDENTIALS:true}

    token:
      access-token:
        secret: ${SECURITY_TOKEN_ACCESS_TOKEN_SECRET}
        expiration: ${SECURITY_TOKEN_ACCESS_TOKEN_EXPIRATION:180000} # 3 minutes in milliseconds

spring:
  application:
    name: rest-server

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        type:
          preferred_uuid_jdbc_type: UUID
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true